name: Build & Release

on:
  push:
    branches: [ main, ui-overhaul ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v2.1.0) — leave empty to only build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Hachimi
          path: build/libs/*.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Hachimi ${{ inputs.tag || github.ref_name }} nya~
          body_path: .github/release-notes.md
          files: |
            build/libs/Hachimi-*.jar
            !build/libs/*-sources.jar
